name: Multi-Arch Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # ODROID-C2 (ARM64 Amlogic S905), Raspberry Pi 4/5, Oracle Ampere
          - os: linux
            arch: arm64
            artifact_name: bumiayu-linux-arm64
          # Standard x86_64 servers (Ubuntu, Debian, Proxmox, VPS)
          - os: linux
            arch: amd64
            artifact_name: bumiayu-linux-amd64
          # 32-bit ARM SBCs (ODROID-U3, Raspberry Pi 2/3 32-bit)
          - os: linux
            arch: arm
            arm: 7
            artifact_name: bumiayu-linux-armv7
          # Windows x64
          - os: windows
            arch: amd64
            artifact_name: bumiayu-windows-amd64.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Static Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X 'main.Version=${{ github.ref_name }}' -X 'main.BuildArch=${{ matrix.arch }}'" \
            -o dist/${{ matrix.artifact_name }} \
            ./cmd/bumiayu

      - name: Compress Artifact
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*/*
          name: "Bumiayu TUI ${{ github.ref_name }} (Beta)"
          draft: false
          prerelease: true
          generate_release_notes: true
